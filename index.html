<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería Masitos - Sabor que une</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="phone-container">

        <!-- Header con Hero Image y Logo -->
        <header class="hero-header">
            <!-- Logo Circular Superior -->
            <div class="logo-container">
                <img src="assets/masitos%20logo.jpeg" alt="Logo Masitos" class="logo-img" id="logo-img">
            </div>

            <!-- Imagen de fondo Hero -->
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&auto=format&fit=crop&q=80" alt="Pizza Hero" class="hero-bg">
            <div class="hero-overlay"></div>
        </header>

        <!-- Títulos y Eslogan -->
        <div class="brand-info">
            <div class="brand-subtitle-top">Pizzería</div>
            <h1 class="brand-title">Masitos</h1>
            
            <div class="categories-line">
                <span>PIZZAS</span>
                <span class="divider">/</span>
                <span>FAJITAS</span>
                <span class="divider">/</span>
                <span>EMPANADAS</span>
            </div>

            <div class="slogan-box">
                Sabor que une
            </div>
        </div>

        <!-- Botones de Acción Principal -->
        <div class="actions-section">
            <!-- Botón 1: Ver Menú y Pedir -->
            <a href="menu.html" class="main-btn btn-primary-red">
                <div class="btn-left">
                    <div class="btn-icon">
                        <i class="fa-solid fa-pizza-slice"></i>
                    </div>
                    <span>Ver Menú y Pedir</span>
                </div>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>

            <!-- Botón 2: Promociones -->
            <a href="promociones.html" class="main-btn btn-dark">
                <div class="btn-left">
                    <div class="btn-icon">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <span>Promociones</span>
                </div>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>

            <!-- Botón 3: Califica tu Experiencia (Google Reviews) -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJ9cFfFKXZYpYRLuAuLp5zfhU" target="_blank" rel="noopener noreferrer" class="main-btn btn-dark">
                <div class="btn-left">
                    <div class="btn-icon">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <span>Califica tu Experiencia</span>
                </div>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>
        </div>

        <!-- Redes Sociales -->
        <div class="social-section">
            <a href="https://www.facebook.com/pizzeriamasitos.bajos.de.mena" target="_blank" rel="noopener noreferrer" class="social-btn facebook">
                <div class="social-left">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #ccc;"></i>
            </a>

            <a href="https://www.instagram.com/pizzeria_masitos/" target="_blank" rel="noopener noreferrer" class="social-btn instagram">
                <div class="social-left">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #ccc;"></i>
            </a>
        </div>

        <!-- Footer / Gorro de Chef -->
        <footer class="app-footer">
            <div class="chef-icon">
                <i class="fa-solid fa-hat-chef"></i>
            </div>
            <div class="italia-stripes">
                <div class="stripe-green"></div>
                <div class="stripe-white"></div>
                <div class="stripe-red"></div>
            </div>
        </footer>

    </div>

    <!-- Scripts -->
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
