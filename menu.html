<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Pizzería Masitos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="phone-container">

        <!-- Header de la Página -->
        <header class="page-header">
            <a href="index.html" class="back-btn" title="Volver">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1 class="page-title">Nuestro Menú</h1>
            <a href="carrito.html" class="cart-icon-header" title="Ver Carrito">
                <i class="fa-solid fa-shopping-cart"></i>
                <span class="cart-badge" style="display: none;">0</span>
            </a>
        </header>

        <!-- Filtros de Categorías (Menú Real) -->
        <div class="categories-filter">
            <button class="cat-chip active" data-categoria="todos">Todos</button>
            <button class="cat-chip" data-categoria="pizza">🍕 Pizzas</button>
            <button class="cat-chip" data-categoria="pan_ajo">🧄 Pan de Ajo</button>
            <button class="cat-chip" data-categoria="fajita">🌯 Fajitas</button>
            <button class="cat-chip" data-categoria="empanada">🥟 Empanadas</button>
            <button class="cat-chip" data-categoria="fritura">🍟 Frituras</button>
            <button class="cat-chip" data-categoria="supremas">🧀 Supremas</button>
            <button class="cat-chip" data-categoria="pollo">🍗 Pollito Crispy</button>
            <button class="cat-chip" data-categoria="vienesa">🌭 Vienesas</button>
            <button class="cat-chip" data-categoria="sandwich">🥪 Churrascos & Mechadas</button>
            <button class="cat-chip" data-categoria="hamburguesa">🍔 Hamburguesas</button>
        </div>

        <!-- Contenedor de Productos -->
        <div class="products-container" id="productos-list">
            <!-- Se inyecta dinámicamente mediante js/app.js -->
        </div>

        <!-- Modal de Ingredientes (Dinámico) -->
        <div id="ingredient-modal-container"></div>

        <!-- Icono Flotante del Carrito -->
        <a href="carrito.html" class="floating-cart-btn" title="Ir al Carrito">
            <i class="fa-solid fa-shopping-cart"></i>
            <span class="floating-cart-badge" style="display: none;">0</span>
        </a>

        <!-- Footer / Gorro de Chef -->
        <footer class="app-footer">
            <div class="chef-icon">
                <i class="fa-solid fa-hat-chef"></i>
            </div>
            <div class="italia-stripes">
                <div class="stripe-green"></div>
                <div class="stripe-white"></div>
                <div class="stripe-red"></div>
            </div>
        </footer>

    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
